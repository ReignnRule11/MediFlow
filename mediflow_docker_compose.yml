version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mediflow
      POSTGRES_PASSWORD: mediflow_secure_password
      POSTGRES_DB: mediflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediflow

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediflow

  backend:
    build:
      context: .
      dockerfile: mediflow_backend_Dockerfile
    environment:
      DATABASE_URL: postgresql://mediflow:mediflow_secure_password@postgres:5432/mediflow
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEBUG: ${DEBUG:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./mediflow_app_*.py:/app/app/
      - ./logs:/app/logs
    networks:
      - mediflow
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  mediflow:
    driver: bridge
